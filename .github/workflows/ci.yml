name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR supersedes its older run. Pushes to main get one group per commit, so
# every merge keeps its own CI result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Tests and CI never call paid APIs (ARCHITECTURE §9, §10). NEXT_PUBLIC_* is inlined at
      # build time, so it must be set for the build step too.
      FAKE_APIS: "1"
      NEXT_PUBLIC_FAKE_APIS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Same LTS major as the laptops (and @types/node), so CI tests what the demo runs.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
